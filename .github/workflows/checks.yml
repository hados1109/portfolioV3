# Runs on every push and pull request. GitHub Pages publishes the repo as it is, so this makes
# sure what's committed is complete: pages rebuilt, images compressed, nothing pointing at a
# missing file. Installs what the build needs from scripts/requirements.txt.
name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the build's packages
        run: pip install -r scripts/requirements.txt

      - name: Pages match src/ and content/
        run: |
          python scripts/build.py
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff --stat
            echo "::error::The built pages are out of date. Run .venv/bin/python scripts/build.py and commit the result. (Edit src/ and content/, not index.html, about/ or work/.)"
            exit 1
          fi

      - name: Images are optimized
        run: python scripts/optimize_images.py --check

      - name: Links and images point at files that exist
        run: python scripts/check_site.py
